eckbox" name="events" value="Robo Tug of War"> ✦ Robo Tug of War</label><label class="check"><input type="checkbox" name="events" value="Robo Soccer"> ◎ Robo Soccer</label></fieldset><button class="btn primary" type="submit">Submit Registration</button><p id="status" class="status"></p></form></div></main><script type="module" src="js/registration.js"></script></body></html>
