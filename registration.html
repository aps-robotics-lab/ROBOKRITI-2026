<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070b">
<meta name="description" content="APS LBS ROBOKRITI 2026">
<title>Register | RoboKriti 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="main.css">
</head><body>
<div class="form-wrap"><div class="container"><a class="btn secondary" href="../index.html">← HOME</a><div style="height:20px"></div>
<div class="form-card">
<div class="kicker">ROBOKRITI 2026 // REGISTRATION</div><h1 class="page-title" style="font-size:clamp(44px,7vw,85px)">ENTER THE ARENA.</h1>
<p class="form-note">FREE ENTRY · CLASSES 6–12 · MAXIMUM 5 MEMBERS · DEADLINE 31 AUGUST 2026</p>
<form id="registrationForm">
<section class="form-section"><div class="kicker">01 // TEAM</div><h2>Team Information</h2>
<div class="field-grid"><div class="field full"><label>Team Name</label><input id="teamName" maxlength="80" placeholder="Optional team name"></div><div class="field"><label>Team Size *</label><select id="teamSize" required><option value="">Select</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div></div></section>
<section class="form-section"><div class="kicker">02 // LEAD PARTICIPANT</div><h2>Captain / Lead</h2><div class="field-grid">
<div class="field"><label>Full Name *</label><input id="leaderName" required></div><div class="field"><label>Class *</label><select id="leaderClass" required><option value="">Select</option><option>VI</option><option>VII</option><option>VIII</option><option>IX</option><option>X</option><option>XI</option><option>XII</option></select></div>
<div class="field"><label>Section *</label><input id="leaderSection" required></div><div class="field"><label>Mobile *</label><input id="mobile" required inputmode="numeric" maxlength="10"></div><div class="field full"><label>Email *</label><input id="email" type="email" required></div>
</div></section>
<section class="form-section"><div class="kicker">03 // TEAM MEMBERS</div><h2>Additional Members</h2><div id="members" class="member-grid"></div></section>
<section class="form-section"><div class="kicker">04 // ARENA</div><h2>Select Event(s)</h2><div class="event-select">
<label><input type="checkbox" value="Robo Soccer"> Robo Soccer</label><label><input type="checkbox" value="Robo Tug of War"> Robo Tug of War</label><label><input type="checkbox" value="Robo Race"> Robo Race</label><label><input type="checkbox" value="Robo War"> Robo War</label>
</div><div class="field" style="margin-top:14px"><label>Remarks (optional)</label><textarea id="remarks" rows="4"></textarea></div></section>
<section class="form-section"><label style="display:flex;gap:10px;align-items:flex-start;font-size:12px"><input id="agree" type="checkbox" required> I confirm the information is accurate and agree to follow the official championship rules and organiser instructions.</label><div id="formMessage" class="form-message"></div><button class="btn primary" type="submit">SUBMIT REGISTRATION →</button></section>
</form></div></div></div>
<script type="module" src="../js/registration.js"></script><script type="module" src="../js/main.js"></script></body></html>
