<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Help Centre | ROBOKRITI 2026</title><link rel="stylesheet" href="css/style.css"></head><body><main class="form-page"><div class="container form-wrap"><a class="text-link" href="index.html">← Home</a><p class="eyebrow" style="margin-top:50px">HELP CENTRE</p><h1>How can we <span>help?</span></h1><form id="helpForm"><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Subject<input name="subject" required></label><label>Message<textarea name="message" required style="width:100%;min-height:140px;background:#05070b;color:white;border:1px solid #263344;padding:13px"></textarea></label><button class="btn primary">Submit Help Request</button><p id="status"></p></form></div></main><script>document.getElementById('helpForm').addEventListener('submit',e=>{e.preventDefault();const id='APS-'+Math.random().toString(36).slice(2,7).toUpperCase();localStorage.setItem('helpTicket',id);document.getElementById('status').textContent=`Request submitted. Reference ID: ${id}. Our team will contact you soon.`;e.target.reset()})</script></body></html>
