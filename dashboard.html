<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Dashboard | RoboKriti 2026</title><link rel="stylesheet" href="../css/main.css"><style>.dash{max-width:1250px}.dash-head{display:flex;justify-content:space-between;gap:20px;align-items:center}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{padding:20px;border:1px solid var(--line);background:var(--panel)}.stat b{font:32px Orbitron;color:var(--cyan);display:block}.table-wrap{overflow:auto;border:1px solid var(--line);margin-top:20px}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:12px}.table th{font:9px Orbitron;color:var(--gold)}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="site-bg"></div><main class="section dash"><div class="dash-head"><div class="section-head"><span>ROBOKRITI 2026 // PRIVATE DEPARTMENT</span><h1 style="font-size:clamp(38px,6vw,70px)">COMMAND <em>CENTER.</em></h1><p id="who">Authenticating…</p></div><button id="logout" class="btn ghost">LOG OUT</button></div><div class="stats"><div class="stat"><small>REGISTRATIONS</small><b id="total">0</b></div><div class="stat"><small>TEAMS</small><b id="teams">0</b></div><div class="stat"><small>SOCCER</small><b id="soccer">0</b></div><div class="stat"><small>RACE</small><b id="race">0</b></div><div class="stat"><small>WAR / TUG</small><b id="other">0</b></div></div><section class="section" style="padding-inline:0"><div class="section-head"><span>REGISTRATION FEED</span><h2>RECENT <b>REGISTRATIONS.</b></h2></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>TEAM</th><th>CAPTAIN</th><th>CLASS</th><th>MEMBERS</th><th>EVENTS</th><th>STATUS</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="section" style="padding-inline:0"><div class="section-head"><span>HELP CENTRE</span><h2>RECENT <b>ENQUIRIES.</b></h2></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>NAME</th><th>CATEGORY</th><th>MESSAGE</th><th>STATUS</th></tr></thead><tbody id="enqRows"></tbody></table></div></section></main><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"></script><script src="../js/firebase-config.js"></script><script>auth.onAuthStateChanged(async u=>{if(!u){location.href='login.html';return}const s=await db.ref('staff/'+u.uid).once('value'),d=s.val();if(!d||d.active!==true){await auth.signOut();location.href='login.html';return}document.getElementById('who').textContent=d.name+' · '+d.role;load()});async function load(){const s=await db.ref('registrations').once('value');const data=s.val()||{};const list=Object.values(data);document.getElementById('total').textContent=list.length;document.getElementById('teams').textContent=list.length;document.getElementById('soccer').textContent=list.filter(x=>(x.events||[]).includes('Robo Soccer')).length;document.getElementById('race').textContent=list.filter(x=>(x.events||[]).includes('Robo Race')).length;document.getElementById('other').textContent=list.filter(x=>(x.events||[]).some(e=>e==='Robo War'||e==='Robo Tug of War')).length;document.getElementById('rows').innerHTML=list.slice(-30).reverse().map(x=>`<tr><td>${esc(x.registrationID)}</td><td>${esc(x.teamDetails?.teamName)}</td><td>${esc(x.teamDetails?.captain)}</td><td>${esc(x.teamDetails?.class)}-${esc(x.teamDetails?.section)}</td><td>${x.members?.length||0}</td><td>${esc((x.events||[]).join(', '))}</td><td>${esc(x.status)}</td></tr>`).join('');const e=await db.ref('enquiries').once('value'),en=Object.values(e.val()||{});document.getElementById('enqRows').innerHTML=en.slice(-30).reverse().map(x=>`<tr><td>${esc(x.enquiryID)}</td><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td>${esc(x.message)}</td><td>${esc(x.status)}</td></tr>`).join('')}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.getElementById('logout').onclick=()=>auth.signOut().then(()=>location.href='login.html');</script></body></html>
