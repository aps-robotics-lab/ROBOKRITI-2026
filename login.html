<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Author Login | RoboKriti 2026</title><link rel="stylesheet" href="../css/main.css"><style>.login{max-width:500px;margin:100px auto}.login form{border:1px solid var(--line);padding:30px;background:var(--panel)}.login label{display:block;font:10px Orbitron;color:#9bb0b5;margin-top:16px}.login input{width:100%;padding:14px;background:#060c11;color:#fff;border:1px solid var(--line);margin-top:7px}.err{color:#ff8f8f;margin-top:12px}</style></head><body><div class="site-bg"></div><main class="section login"><div class="section-head center"><span>PRIVATE DEPARTMENT</span><h1 style="font-size:48px">AUTHOR <em>ACCESS.</em></h1><p>Authorized RoboKriti management only.</p></div><form id="login"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn primary" style="width:100%;margin-top:20px">SIGN IN →</button><div class="err" id="err"></div></form><p style="text-align:center;margin-top:20px"><a href="../index.html">← Public website</a></p></main><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"></script><script src="../js/firebase-config.js"></script><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();try{const c=await auth.signInWithEmailAndPassword(document.getElementById('email').value,document.getElementById('password').value);const s=await db.ref('staff/'+c.user.uid).once('value');const d=s.val();if(!d||d.active!==true||(d.role!=='author'&&d.role!=='agent'))throw new Error('Not authorized');location.href='dashboard.html'}catch(x){document.getElementById('err').textContent='Invalid login or unauthorized account.';try{await auth.signOut()}catch(_){}}}</script></body></html>
